name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Materialdaten aus hp-FEM (nur lesen, nur python/hpfem/data)
        uses: actions/checkout@v4
        with:
          repository: PhotonPower/hp-FEM
          path: hp-FEM
          sparse-checkout: python/hpfem/data
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Systembibliotheken für Gmsh
        run: sudo apt-get update && sudo apt-get install -y libglu1-mesa libxrender1 libxcursor1 libxft2 libxinerama1
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q
        env:
          HPFEM_DATA: ${{ github.workspace }}/hp-FEM/python/hpfem/data
