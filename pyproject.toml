[project]
name = "gui-hpfem"
version = "0.2.0"
description = "Streamlit-GUI (FEM-Modellwerkstatt) für die hp-FEM-Bibliothek für Nano-Optik"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["streamlit>=1.35", "numpy", "pandas", "matplotlib", "gmsh"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 160
extend-exclude = ["fem_work"]

[tool.ruff.lint]
select = ["E9", "F"]
ignore = ["F401", "F841"]
